name: Deploy to GitHub Pages

on:
  push:
    # The admin page commits content to whichever branch the site is served from,
    # so deploy from both the working branch and main once it exists.
    branches: [main, claude/artist-portfolio-lp-d32xhg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Content edits from the admin page arrive as rapid commits; let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on for the repo, so the site goes live from this
      # workflow alone — no manual switch in Settings > Pages first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
